<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barn Builder">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3f5f1">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Tom's Barn Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap">
<style>
/* Layout: one full-screen 3D scene; a view strip floats on top, a dock with four work tabs sits on the bottom. */
:root{
  --paper:#f3f5f1; --panel:#ffffff; --ink:#1c2a3a; --pencil:#5d6570; --line:#cdd5d1;
  --marker:#1f4fd1; --marker-ink:#ffffff; --marker-soft:#e3eafc; --danger:#b3261e;
  --sky:#e7ece8; --ground:#dbe2d9; --grid:#8fa6b8;
  --font-ui:"Barlow","Helvetica Neue",Arial,sans-serif;
  --font-head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12161b; --panel:#1b2129; --ink:#e8edf2; --pencil:#9aa4af; --line:#303a46;
  --marker:#86a8ff; --marker-ink:#0d1526; --marker-soft:#22304f; --danger:#ff8a80;
  --sky:#10151a; --ground:#1b2228; --grid:#41556b; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#12161b; --panel:#1b2129; --ink:#e8edf2; --pencil:#9aa4af; --line:#303a46;
  --marker:#86a8ff; --marker-ink:#0d1526; --marker-soft:#22304f; --danger:#ff8a80;
  --sky:#10151a; --ground:#1b2228; --grid:#41556b; color-scheme:dark }

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:17px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

button{font:inherit;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;
  min-height:48px;padding:8px 16px;cursor:pointer;line-height:1.15;touch-action:manipulation}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
button[aria-pressed="true"]{background:var(--marker-soft);border-color:var(--marker)}
button.primary{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
button.danger{color:var(--danger)}
button:disabled{opacity:.45;cursor:default}

.bar{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.bar > *{pointer-events:auto}
.brand{font-family:var(--font-head);font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;line-height:1.1}
.brand small{display:block;font-family:var(--font-ui);font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:none;color:var(--pencil)}
.spacer{flex:1 1 0;min-width:0}
.projbtn{max-width:min(300px,60vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.proj{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.proj .what{flex:1 1 200px;min-width:0}
.sheet input{font:inherit;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);
  width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.sheet input:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.group{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--marker);color:var(--marker-ink)}

.dock{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;max-height:52%;overflow-y:auto}
.maintabs{display:flex;gap:6px}
.maintabs button{flex:1 1 0;white-space:nowrap;font-weight:600;font-size:18px;min-height:52px}
.maintabs button[aria-pressed="true"]{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.maintabs button.collapse{flex:0 0 auto;font-weight:500;font-size:16px}
.dockmin{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dockmin .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{margin:0;color:var(--pencil);font-size:16px;line-height:1.35}
.sel{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.sel .what{min-width:0;flex:1 1 220px}
.name{font-family:var(--font-head);font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1.15}
.dims{color:var(--pencil);font-size:16px;font-variant-numeric:tabular-nums}
.warn{color:var(--danger);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stepper{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px 4px 2px 10px;font-size:16px}
.stepper span{font-variant-numeric:tabular-nums;min-width:9ch}
.stepper button{min-width:48px;padding:8px 0;border:0;font-size:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{white-space:nowrap;min-height:44px;padding:6px 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:124px}
.chip small{color:var(--pencil);font-size:14px;font-variant-numeric:tabular-nums;font-weight:400}
.field{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.field .lab{flex:1 1 220px;min-width:0}
.field .lab b{display:block;font-size:19px;font-weight:600}
.field .lab span{color:var(--pencil);font-size:15px}
.bigstep{display:flex;align-items:center;gap:8px}
.bigstep output{font-size:22px;font-weight:600;min-width:6.5ch;text-align:center;font-variant-numeric:tabular-nums}
.bigstep button{min-width:60px;min-height:52px;font-size:26px;padding:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:52px;height:52px;min-height:52px;padding:0;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--marker);box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--marker)}

.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:70px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;width:min(300px,calc(100% - 32px));z-index:8}
.menu button{text-align:left}
.mpage{display:flex;flex-direction:column;gap:6px}
.mhead{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--pencil);padding:8px 6px 0}
.mpage > .mhead:first-child,.mpage > button[hidden] + .mhead{padding-top:2px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mgrid button{text-align:center;padding:8px 4px}
.mnext{display:flex;justify-content:space-between;align-items:center}
.mnext span[aria-hidden]{font-size:22px;line-height:1;color:var(--pencil)}
.mback{align-self:flex-start;border:0;background:transparent;color:var(--marker);font-weight:600;padding-left:6px}
.menu{max-height:calc(100% - 90px);overflow-y:auto}
.about{border-top:1px solid var(--line);margin-top:4px;padding:12px 4px 4px;display:flex;flex-direction:column;gap:10px}
.about .name{font-size:20px}
.about .by{color:var(--pencil);font-size:14px}
.about .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.about .stat{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.about .stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--pencil)}
.about .stat b{font-family:var(--font-head);font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.about .tab{display:flex;align-items:center;gap:10px;background:var(--marker-soft);border-radius:8px;padding:8px 10px}
.about .mug{color:var(--marker);flex:0 0 auto;display:flex}
.about .tab b{display:block;font-size:15px}
.about .tab span{display:block;font-size:13px;color:var(--pencil);line-height:1.3}
.slice{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:70px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100% - 32px));z-index:8}
.slice .seg button{flex:1 1 0;padding:8px 6px}
.slice input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--marker)}
.modal{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(540px,100%);
  max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2,.bphead h2{font-family:var(--font-head);font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.sheet p{margin:0;line-height:1.45}
.sheet textarea{font:16px/1.4 ui-monospace,Menlo,monospace;width:100%;min-height:120px;box-sizing:border-box;border:1px solid var(--line);
  border-radius:8px;padding:10px;background:var(--paper);color:var(--ink);-webkit-user-select:text;user-select:text}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:76px;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:999px;font-size:16px;z-index:25;max-width:calc(100% - 32px);text-align:center}

.bp{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--paper);z-index:15;display:flex;flex-direction:column}
.bphead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bphead .what{flex:1 1 240px;min-width:0}
.bpbody{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:16px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bpbody svg{width:100%;max-width:1100px;height:auto;background:#ffffff;border:1px solid var(--line);flex:0 0 auto}

@media (max-width:1280px){ .brand{display:none} }
.palette{display:flex;flex-direction:column;gap:10px}
.shareopts{display:flex;flex-direction:column;gap:8px}
.shareopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:10px 14px}
.shareopt b{font-size:18px}
.shareopt span{color:var(--pencil);font-size:14px;font-weight:400}
.installbar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:6;
  background:var(--panel);border:1px solid var(--marker);border-radius:10px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px}
.installbar span{flex:1 1 auto;min-width:0;font-size:15px;line-height:1.3}
.installbar .x{min-width:44px;padding:0;font-size:20px}
.installbar button{white-space:nowrap;flex:0 0 auto}
.shareicon{display:inline-block;vertical-align:-4px;width:20px;height:20px;color:var(--marker)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;line-height:1.4}
@media (min-width:641px){ .phone-only{display:none!important} }
@media (max-width:640px){
  .wide-only,.brand,.spacer{display:none!important}
  body{font-size:15px}
  button{min-height:44px;padding:6px 12px}
  .bar{gap:6px;padding-block:8px}
  .bar .projbtn{flex:1 1 0;min-width:0;max-width:none;text-align:left}
  .bar .group{flex:0 0 auto;flex-wrap:nowrap}
  .bar .seg{order:3;flex:1 1 100%}
  .bar .seg button{flex:1 1 0;min-height:40px;padding:4px 6px}
  .menu{width:min(260px,calc(100% - 32px))}
  .toast{top:112px}
  .dock{gap:8px;padding-block:8px;max-height:46%}
  .maintabs{gap:4px}
  .maintabs button{font-size:15px;min-height:44px;padding:6px 2px}
  .maintabs button.collapse{flex:0 0 44px;font-size:16px}
  .dock .hint{font-size:14px}
  .name{font-size:18px}
  .dims{font-size:14px}
  .sel{gap:6px}
  .sel .what{flex:1 1 100%}
  .sel .row{width:100%;gap:6px}
  .sel .row > button{flex:1 1 auto;padding:6px 10px}
  .palette.has-sel{display:none}
  .palette{gap:8px}
  .tabs button{min-height:38px;font-size:14px;padding:4px 10px}
  .chip{min-width:104px;padding:6px 10px}
  .chip small{font-size:12px}
  .stepper{font-size:14px;padding-left:8px}
  .stepper span{min-width:0}
  .stepper button{min-width:42px}
  .field{gap:4px 8px}
  .field .lab{flex:1 1 110px}
  .field .lab b{font-size:16px}
  .field .lab span{display:none}
  .bigstep{gap:4px}
  .bigstep output{font-size:18px;min-width:5.5ch}
  .bigstep button{min-width:48px;min-height:44px;font-size:22px}
  .swatches{flex-wrap:nowrap;overflow-x:auto;width:100%;padding:6px 6px 8px}
  .swatch{width:40px;height:40px;min-height:40px;flex:0 0 auto}
  .dockmin .name{font-size:16px}
  .sheet{padding:14px;gap:10px}
  .bphead button{flex:1 1 auto}
}
@media print{
  html,body,.app{height:auto;overflow:visible}
  .app > *:not(.bp){display:none!important}
  .bp{position:static;display:block} .bphead{display:none} .bpbody{display:block;overflow:visible;padding:0}
  .bpbody svg{display:block;border:0;width:10.2in;max-width:none;height:auto;margin:0 auto;page-break-after:always;break-inside:avoid}
  .bpbody svg:last-child{page-break-after:auto}
  @page{size:letter landscape;margin:.25in}
}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="scene" tabindex="0" aria-label="3D view of the barn"></canvas>

  <header class="bar">
    <h1 class="brand">Tom's Barn Builder<small>Software by Nick Moore</small></h1>
    <button id="btnProject" class="projbtn" aria-haspopup="dialog">Project</button>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="How to look at it">
      <button id="v-inside" aria-pressed="true">Inside</button>
      <button id="v-outside" aria-pressed="false">Outside</button>
      <button id="v-above" aria-pressed="false"><span class="wide-only">From above</span><span class="phone-only">Above</span></button>
    </div>
    <div class="group">
      <button id="btnUndo" disabled>Undo</button>
      <button id="btnSlice" class="wide-only" aria-pressed="false">Slice</button>
      <button id="btnMeasure" class="wide-only" aria-pressed="false">Measure</button>
      <button id="btnBlueprint" class="wide-only">Blueprint</button>
      <button id="btnMore" aria-expanded="false">Menu</button>
    </div>
  </header>

  <div class="menu" id="menu" hidden>
    <div class="mpage" id="menuMain">
      <button id="mInstall" class="primary" hidden>Add to Home Screen</button>
      <div class="mhead phone-only">Tools</div>
      <div class="mgrid phone-only"><button id="mBlueprint">Blueprint</button><button id="mSlice">Slice</button><button id="mMeasure">Measure</button></div>
      <div class="mhead">Share and save</div>
      <button id="mPdf">Share</button>
      <button id="mCopy">Save to a file</button>
      <button id="mPaste">Open a barn</button>
      <div class="mhead">More</div>
      <button id="mHelp">Help</button>
      <button id="mToSettings" class="mnext"><span>Settings</span><span aria-hidden="true">›</span></button>
    </div>
    <div class="mpage" id="menuSettings" hidden>
      <button id="mBack" class="mback">‹ Back</button>
      <div class="mhead">Settings</div>
      <button id="mLabels" aria-pressed="true">Name tags</button>
      <button id="mRefresh">Refresh</button>
      <button id="mReset" class="danger">Start over</button>
      <div class="about" id="mVersion"></div>
    </div>
  </div>

  <div class="slice" id="slicePanel" hidden>
    <div class="name">Slice the barn open</div>
    <div class="seg" role="group" aria-label="Cut from which side">
      <button data-from="front">Front</button><button data-from="back">Back</button><button data-from="left">Left</button><button data-from="right">Right</button>
    </div>
    <label for="sliceRange" class="dims" id="sliceLabel">How much to cut away</label>
    <input type="range" id="sliceRange" min="0" max="50" step="1" value="25">
    <div class="row"><button id="sliceDone" class="primary">Done</button><button id="sliceOff">Put it back together</button></div>
  </div>

  <div class="slice" id="measurePanel" hidden>
    <div class="name">Measure</div>
    <div class="dims" id="measureLabel" role="status">Tap the first spot, then the second.</div>
    <div class="row"><button id="measureDone" class="primary">Done measuring</button><button id="measureClear">Clear</button></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <section class="dock" id="dock"></section>

  <section class="bp" id="bp" hidden aria-label="Blueprint">
    <div class="bphead">
      <div class="what"><h2>Blueprint</h2><div class="dims" id="bpStatus">Four sheets, drawn from the barn as it is right now.</div></div>
      <button id="bpPrint" hidden>Print</button>
      <button id="bpShare">Share</button>
      <button id="bpSave" class="primary">Save as PDF to print</button>
      <button id="bpClose">Back to the barn</button>
    </div>
    <div class="bpbody" id="bpBody"></div>
  </section>

  <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
function h(tag,props,...kids){const e=document.createElement(tag);
  for(const k in (props||{})){const v=props[k]; if(k==='class')e.className=v; else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,''); else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(const c of kids.flat()){ if(c==null||c===false)continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;}
const snap=v=>Math.round(v*2)/2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), num=(v,d)=>(v!=null&&v!==''&&Number.isFinite(+v))?+v:d, has=(o,k)=>typeof k==='string'&&Object.prototype.hasOwnProperty.call(o,k);
function ft(x){const i=Math.round(x*12),f=Math.floor(i/12),r=i%12;return f+' ft'+(r?' '+r+' in':'');}
function sh(x){const i=Math.round(x*12),r=i%12;return Math.floor(i/12)+"'"+(r?r+'"':'');}
function fi(x){const i=Math.round(x*12);return Math.floor(i/12)+"'-"+(i%12)+'"';}

if(!window.THREE||!THREE.OrbitControls){
  $('dock').append(h('p',{class:'hint'},'The 3D drawing tools did not load. Check the internet connection and reload this page.'));return;}

/* ================= the building (feet; x runs left to right, z runs back to front, seen from the front doors) ================= */
const T=0.5, W_ALL=60, D_ALL=48;
const DEF_P={wall:10,pitch:4,lean:7,leanIn:9.5,siding:'#a8322a',roof:'#b4b9bd',door:'#f4f3ee'}, P=Object.assign({},DEF_P);
const eave=()=>P.wall, ridge=()=>P.wall+16*P.pitch/12, leanHi=()=>Math.min(P.leanIn,P.wall), leanLo=()=>Math.min(P.lean,leanHi()-.5);

function topFor(w){const L=w.L;switch(w.def.k){
  case 'gable':return [[0,eave()],[L/2,ridge()],[L,eave()]];
  case 'main':return [[0,eave()],[L,eave()]];
  case 'up':return [[0,leanLo()],[L,leanHi()]];
  case 'down':return [[0,leanHi()],[L,leanLo()]];
  default:return [[0,leanLo()],[L,leanLo()]];}}
function hAt(w,u){const t=topFor(w);for(let i=1;i<t.length;i++){if(u<=t[i][0]||i===t.length-1){const a=t[i-1],b=t[i];return a[1]+(b[1]-a[1])*clamp((u-a[0])/(b[0]-a[0]),0,1);}}return t[0][1];}

function roofAt(x,z){if(z<0||z>D_ALL||x<0||x>W_ALL)return null;

function textTexture(lines,ink,bg){const c=document.createElement('canvas'),x=c.getContext('2d');

  if(bg){x.fillStyle=bg;const r=c.height/2;x.beginPath();x.moveTo(r,0);x.arcTo(c.width,0,c.width,c.height,r);x.arcTo(c.width,c.height,0,c.height,r);x.arcTo(0,c.height,0,0,r);x.arcTo(0,0,c.width,0,r);x.fill();}
  x.font=font;x.fillStyle=ink;x.textAlign='center';x.textBaseline='middle';
  lines.forEach((l,i)=>x.fillText(l,c.width/2,14+fs*1.15*(i+.5)));
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return {t,asp:c.width/c.height};}

function applyState(s){
  if(drag){drag=null;controls.enabled=true;}
  const seen=new Set(),freshId=v=>{let id=typeof v==='string'||typeof v==='number'?String(v):'';if(!id||seen.has(id))id=nid();seen.add(id);return id;};
  const sw=(s.walls&&typeof s.walls==='object')?s.walls:{};
  const b=(s.b&&typeof s.b==='object')?s.b:{},hex=(v,d)=>/^#[0-9a-f]{6}$/i.test(v||'')?v:d;
  P.wall=clamp(num(b.wall,DEF_P.wall),8,20);P.pitch=clamp(num(b.pitch,DEF_P.pitch),1,12);P.lean=clamp(num(b.lean,DEF_P.lean),5,18);P.leanIn=clamp(num(b.leanIn,P.wall-.5),6,20);
  P.siding=hex(b.siding,DEF_P.siding);P.roof=hex(b.roof,DEF_P.roof);P.door=hex(b.door,DEF_P.door);buildRoof();applyColors();
  for(const id in walls){const ws=has(sw,id)&&sw[id]&&typeof sw[id]==='object'?sw[id]:null, w=walls[id]; w.ops=[];
    w.state=ws&&WALL_STATES.some(x=>x[0]===ws.s)?ws.s:w.def.s;
    ((ws&&Array.isArray(ws.o)&&ws.o)||[]).forEach(o=>{if(!o||!has(OPS,o.t))return;const d=OPS[o.t];
      const n={i:freshId(o.i),t:o.t,u:num(o.u,w.L/2),w:clamp(num(o.w,d.w),d.minW,d.maxW),h:clamp(num(o.h,d.h),2,d.maxH||d.h),k:d.k,d:o.t==='slider'?clamp(Math.round(num(o.d,0)),-1,1):0};
      fitOp(w,n); if(!overlaps(w,n))w.ops.push(n);});
    buildWall(w);}
  items.forEach(removeItemMesh); items=[];
  (Array.isArray(s.items)?s.items:[]).forEach(it=>{if(!it||!has(CAT,it.t))return;
    const o={i:freshId(it.i),t:it.t,x:clamp(num(it.x,30),-30,90),z:clamp(num(it.z,24),-30,90),r:((num(it.r,0)%360)+360)%360};

  items.forEach(q=>{if(q.up)placeItem(q);});

function fitOp(w,o){o.w=Math.min(o.w,w.L-1); o.u=clamp(o.u,o.w/2+.25,w.L-o.w/2-.25);
  const room=Math.min(hAt(w,o.u-o.w/2),hAt(w,o.u+o.w/2))-.4-o.k; o.eh=Math.max(.5,Math.min(o.h,Math.floor(room*2+1e-6)/2));}
function overlaps(w,o){return w.ops.some(p=>p!==o&&Math.abs(p.u-o.u)<(p.w+o.w)/2+.25);}
function postsAt(w){const n=w.L<=16?1:Math.round(w.L/8),a=[];for(let i=0;i<=n;i++)a.push(i*w.L/n);return a;}
function buildWall(w){const g=w.group; emptyGroup(g);
  const L=w.L, top=topFor(w);
  if(w.state==='none'){box(g,L,.05,.9,L/2,.02,0,w.m.none);return;}
  const s=new THREE.Shape();
  if(w.state==='open'){const bh=.8; s.moveTo(top[0][0],top[0][1]-bh); for(let i=1;i<top.length;i++)s.lineTo(top[i][0],top[i][1]-bh);
    for(let i=top.length-1;i>=0;i--)s.lineTo(top[i][0],top[i][1]); s.closePath();
    postsAt(w).forEach(u=>box(g,.5,hAt(w,u)-.1,.5,clamp(u,.25,L-.25),0,0,w.m.post));
    const geo=new THREE.ExtrudeGeometry(s,{depth:T,bevelEnabled:false});geo.translate(0,0,-T/2); g.add(new THREE.Mesh(geo,w.m.post)); return;}
  s.moveTo(0,0); s.lineTo(L,0); for(let i=top.length-1;i>=0;i--)s.lineTo(top[i][0],top[i][1]); s.closePath();
  w.ops.forEach(o=>{const p=new THREE.Path(),u0=o.u-o.w/2,u1=o.u+o.w/2,v0=Math.max(o.k,.06),v1=o.k+o.eh;
    p.moveTo(u0,v0);p.lineTo(u1,v0);p.lineTo(u1,v1);p.lineTo(u0,v1);p.closePath();s.holes.push(p);});
  const geo=new THREE.ExtrudeGeometry(s,{depth:T,bevelEnabled:false});geo.translate(0,0,-T/2); g.add(new THREE.Mesh(geo,w.m.wall));
  w.ops.forEach(o=>{const og=new THREE.Group(); og.position.set(o.u,o.k,0); og.userData.pick={kind:'op',wallId:w.def.id,opId:o.i}; og.userData.opId=o.i; g.add(og);
    if(o.t==='entry'){box(og,o.w-.15,o.eh-.08,.2,0,.06,0,w.m.door);box(og,.25,.25,.34,o.w/2-.55,3,0,w.m.groove);}
    else if(o.t==='double'){box(og,o.w/2-.12,o.eh-.08,.2,-o.w/4,.06,0,w.m.door);box(og,o.w/2-.12,o.eh-.08,.2,o.w/4,.06,0,w.m.door);}
    else if(o.t==='ohd'){box(og,o.w-.1,o.eh-.06,.16,0,.06,0,w.m.door);const n=Math.max(3,Math.round(o.eh/2));for(let i=1;i<n;i++)box(og,o.w-.1,.07,.2,0,o.eh*i/n,0,w.m.groove);}
    else if(o.t==='slider'){const z=T/2+.1,dir=o.d||0;

let seenHelp=false; try{seenHelp=!!localStorage.getItem(KEY+'.seen');localStorage.setItem(KEY+'.seen','1');}catch(e){}
let incoming=null;
const inHomeApp=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches, touchDevice=matchMedia('(pointer:coarse)').matches;
/* installing: Android Chrome hands us a real prompt; iPhone and iPad only allow showing the steps */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let installEvt=null;
const canInstall=()=>canLink&&!inHomeApp&&(!!installEvt||isIOS);
function updateInstall(){$('mInstall').hidden=!canInstall();const bar=$('installBar');if(bar&&!canInstall())bar.remove();}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;updateInstall();maybeInstallBar();});
window.addEventListener('appinstalled',()=>{installEvt=null;updateInstall();toast('Added. Open Barn Builder from your Home Screen.');});
const SHARE_SVG='<svg class="shareicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
function installApp(){closeMenu();const bar=$('installBar');if(bar)bar.remove();
  if(installEvt){const ev=installEvt;ev.prompt();(ev.userChoice||Promise.resolve()).then(()=>{installEvt=null;updateInstall();},()=>{});return;}
  const share=h('span');share.innerHTML=SHARE_SVG;
  dialog('Add Barn Builder to your Home Screen',h('p',null,'Then it opens like an app, full screen, from its own barn icon.'),
    h('ol',{class:'steps'},h('li',null,'Tap the Share button ',share,' in Safari. If you don’t see it, tap the ••• button first.'),
      h('li',null,'Scroll down and tap Add to Home Screen.'),h('li',null,'Tap Add.')),
    h('p',{class:'dims'},'Barns made here in Safari may not show up in the Home Screen app. To bring one along, use Save to a file, then Open a barn in the app.'),
    h('div',{class:'row'},h('button',{class:'primary',onclick:closeDialog},'OK')));}
$('mInstall').onclick=installApp;
function maybeInstallBar(){if(!canInstall()||!touchDevice||$('installBar'))return;let seen=false;try{seen=!!localStorage.getItem(KEY+'.installHint');}catch(e){}if(seen)return;
  const hide=()=>{try{localStorage.setItem(KEY+'.installHint','1');}catch(e){}const b=$('installBar');if(b)b.remove();};
  const bar=h('div',{class:'installbar',id:'installBar',role:'region','aria-label':'Add to Home Screen'},h('span',null,'Use Barn Builder like an app on this '+(isIOS&&/iPad|Macintosh/.test(navigator.userAgent)?'iPad':'phone')+'.'),
    h('button',{class:'primary',onclick:()=>{hide();installApp();}},'Add it'),h('button',{class:'x','aria-label':'No thanks',onclick:hide},'\u00D7'));
  bar.style.top=(document.querySelector('.bar').offsetHeight+6)+'px';app.append(bar);}
function toHomeApp(o){const text=linkFor(o),note=h('p',{class:'dims',role:'status'},''),ta=h('textarea',{id:'codeOut','aria-label':'Barn link'},text);
  const steps=h('ol',{class:'steps'},h('li',null,'Go to your Home Screen and open Barn Builder.'),h('li',null,'Tap Menu, then Open a barn.'),h('li',null,'Tap Paste and open.'));
  dialog('Open it in your Home Screen app',h('p',null,'Links always open here in the browser, so the barn needs to be pasted into the app.'),note,steps,ta,h('div',{class:'row'},h('button',{class:'primary',onclick:closeDialog},'OK'),canInstall()?h('button',{onclick:installApp},'I don’t have the app yet'):null));
  ta.hidden=true;
  const done=()=>{note.textContent='The barn is copied. Now:';},fail=()=>{ta.hidden=false;ta.focus();try{ta.setSelectionRange(0,text.length);}catch(e){ta.select();}note.textContent='Tap the text below and choose Copy. Then:';};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fail);else fail();}
let linkInfo=null;
function readIncoming(){let o=null;const raw=location.search+location.hash;if(!/BARN[123]/i.test(raw))return null;
  linkInfo={len:raw.length,kind:(raw.match(/BARN[123]/i)||['?'])[0].toUpperCase(),why:'could not be decoded'};
  try{o=decode(raw);}catch(e){try{o=decode(decodeURIComponent(raw));}catch(e2){}}
  try{history.replaceState(null,'',location.pathname);}catch(e){}if(o)linkInfo.why='';return o||{bad:true};}
function offerIncoming(o){const nm=cleanName(o.name);closeMenu();
  const key=o.bad?null:sharedKey(o);
  if(key==null){dialog('That link could not be opened',h('p',null,'The barn in it could not be read. It may have been cut off when it was sent. Ask for it to be sent again, or as a file.'),
    linkInfo?h('p',{class:'dims'},'Details: app version '+VERSION+' · '+linkInfo.kind+' link · '+linkInfo.len+' characters · '+(linkInfo.why||'unknown')):null,h('div',{class:'row'},h('button',{class:'primary',onclick:closeDialog},'OK')));return;}
  const same=sameProject(key);
  if(same){const open=same.id===curId;
    dialog('You already have this barn',h('p',null,open?'This link is the same as “'+same.name+'”, which is open now. Nothing in it is new.':'This link is the same as your “'+same.name+'”.'),
      h('div',{class:'row'},open?h('button',{class:'primary',onclick:closeDialog},'OK'):h('button',{class:'primary',onclick:()=>{openProject(same.id);closeDialog();toast('Showing “'+same.name+'”.');}},'Show it'),
        h('button',{onclick:()=>{const m=loadShared(o,true);closeDialog();if(m)toast(m);}},'Open a copy anyway'),open?null:h('button',{onclick:closeDialog},'Cancel')));return;}
  dialog('Open the shared barn?',h('p',null,'This link has a barn layout'+(nm?' called “'+nm+'”':'')+'. It opens as a new project, and your own projects stay as they are.'),
    h('div',{class:'row'},h('button',{class:'primary',onclick:()=>{const m=loadShared(o);if(m){closeDialog();toast(m);}else toast('That layout could not be opened.');}},'Open it here'),
      (!inHomeApp&&touchDevice)?h('button',{onclick:()=>toHomeApp(o)},'Open it in my Home Screen app'):null,h('button',{onclick:closeDialog},'No thanks')));}
window.addEventListener('hashchange',()=>{const o=readIncoming();if(o)offerIncoming(o);});
incoming=readIncoming();
if(incoming)offerIncoming(incoming);
else if(!saved&&!seenHelp)help();
updateInstall(); maybeInstallBar();
window.__barn={getState,applyState,walls,cam,items:()=>items,blueprintSheets,captureViews,encodeLink,decode,compactState};
})();
